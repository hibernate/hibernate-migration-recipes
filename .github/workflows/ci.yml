name: Java CI with Gradle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Cache resolver repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/converted-build-fixtures/resolver-cache/maven
            build/converted-build-fixtures/resolver-cache/ivy
            build/converted-build-fixtures/resolver-cache/ant
          key: isolated-resolvers-v1-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'buildSrc/src/main/kotlin/MigrationTestingPlugin.kt', 'src/main/resources/META-INF/rewrite/orm80.yml', 'src/conversionTestOrm80/java/org/hibernate/migration/recipes/orm80/OrmCoordinate*.java') }}
          restore-keys: |
            isolated-resolvers-v1-${{ runner.os }}-

      # Avoid CPU contention between the conversion forks and other verification tasks.
      - name: Run conversion tests in isolation
        run: ./gradlew conversionTestOrm80 --daemon --stacktrace

      - name: Build and run remaining checks
        run: ./gradlew build --daemon --stacktrace -x conversionTestOrm80

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/test-results/
            build/reports/tests/
            buildSrc/build/test-results/
            buildSrc/build/reports/tests/
