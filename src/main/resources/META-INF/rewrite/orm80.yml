---
type: specs.openrewrite.org/v1beta/recipe
name: org.hibernate.migration.recipes.orm80
displayName: Migrate from Hibernate ORM 7.4 to 8.0 comprehensively
description: >-
  Applies the required ORM 7.4 to 8.0 migrations and migrates supported deprecated
  APIs and configuration. Includes XML descriptor modernization. Does not include
  temporal modernization or Hibernate platform adoption. Unsupported usages may
  require manual migration; this recipe does not guarantee a complete upgrade.
recipeList:
  - org.hibernate.migration.recipes.orm80-required
  - org.hibernate.migration.recipes.jpa4.MigrateOrmXml
  - org.hibernate.migration.recipes.jpa4.MigrateEntityManagerGetDelegate
  - org.hibernate.migration.recipes.jpa4.MigrateMapKeyNameToValue
  - org.hibernate.migration.recipes.orm80.MigrateOptimisticLockExclusion
  - org.hibernate.migration.recipes.orm80.MigrateClientEnhancementOption
---
type: specs.openrewrite.org/v1beta/recipe
name: org.hibernate.migration.recipes.orm80-required
displayName: Apply required Hibernate ORM 7.4 to 8.0 migrations
description: >-
  Migrates supported usages that need changes to compile, bootstrap, or preserve
  behavior with ORM 8.0. Selected recipes may also perform ancillary edits such as
  XML descriptor version updates. Does not include temporal modernization or Hibernate
  platform adoption. Unsupported usages may require manual migration; this recipe
  does not guarantee a complete upgrade.
recipeList:
  - org.hibernate.migration.recipes.jpa4.MigrateNamedQueryToStatement
  - org.hibernate.migration.recipes.jpa4.MigratePersistenceXml
  - org.hibernate.migration.recipes.orm80.MigrateMappingXml
  - org.hibernate.migration.recipes.orm80.MigrateQueryFlushMode
  - org.hibernate.migration.recipes.orm80.MigrateQueryHints
  - org.hibernate.migration.recipes.orm80.MigrateFindMultipleOptions
  - org.hibernate.migration.recipes.orm80.MigrateSqlResultVerification
  - org.hibernate.migration.recipes.orm80.MigrateOrmCoordinates:
      targetVersion: '@orm80TargetVersion@'
