---
type: specs.openrewrite.org/v1beta/recipe
name: org.hibernate.migration.recipes.jpa4
displayName: Migrate from JPA 3.x to JPA 4.0
description: >-
  Migrates Jakarta Persistence 3.x usage to JPA 4.0.
  Converts DML-oriented @NamedQuery to @NamedStatement,
  @NamedNativeQuery to @NamedNativeStatement,
  updates persistence and entity-mapping XML descriptors,
  replaces EntityManager.getDelegate() with unwrap(Object.class),
  and renames the deprecated @MapKey(name=...) attribute to value.
recipeList:
  - org.hibernate.migration.recipes.jpa4.MigrateNamedQueryToStatement
  - org.hibernate.migration.recipes.jpa4.MigratePersistenceXml
  - org.hibernate.migration.recipes.jpa4.MigrateOrmXml
  - org.hibernate.migration.recipes.jpa4.MigrateEntityManagerGetDelegate
  - org.hibernate.migration.recipes.jpa4.MigrateMapKeyNameToValue
