---
type: specs.openrewrite.org/v1beta/recipe
name: org.hibernate.migration.recipes.MigrateJpa3To4
displayName: Migrate from JPA 3.x to JPA 4.0
description: >-
  Migrates Jakarta Persistence 3.x usage to JPA 4.0.
  Converts DML-oriented @NamedQuery to @NamedStatement,
  @NamedNativeQuery to @NamedNativeStatement,
  updates persistence.xml schema references,
  replaces EntityManager.getDelegate() with unwrap(Object.class),
  replaces @Temporal with java.time field types,
  and renames the deprecated @MapKey(name=...) attribute to value.
recipeList:
  - org.hibernate.migration.recipes.MigrateNamedQueryToStatement
  - org.hibernate.migration.recipes.UpdatePersistenceXmlVersion
  - org.hibernate.migration.recipes.MigrateEntityManagerGetDelegate
  - org.hibernate.migration.recipes.MigrateTemporalAnnotation
  - org.hibernate.migration.recipes.MigrateMapKeyNameToValue
